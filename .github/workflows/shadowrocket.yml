name: 生成小火箭和圈X配置

on:
  push:
    paths:
      - rules.yaml
      - "*.template.conf"
      - tools/convert.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/convert.py
      - name: 提交生成的配置
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadowrocket.conf quantumultx.conf quantumultx-rules.list
          git diff --cached --quiet || git commit -m "自动生成小火箭和圈X配置"
          git push
      - name: 刷新 jsDelivr 缓存
        run: |
          for f in shadowrocket.conf quantumultx.conf quantumultx-rules.list; do
            curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" || true
          done
