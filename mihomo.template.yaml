# mihomo（OpenClash / Clash Verge）配置模板（生成 mihomo.yaml 用，别直接导入这个文件）
# 节点由 Sub-Store「文件 → mihomo 配置」注入，这里只放分组和分流规则
# {{CUSTOM_RULES}} 会被替换成 rules.yaml 里的规则

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies: [♻️ 自动选择, 🇭🇰 香港节点, 🇺🇸 美国节点, 🇬🇧 英国节点, 🇩🇪 德国节点, 🇲🇽 墨西哥节点, 🏠 家宽节点, DIRECT]
    include-all: true
  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    filter: "^((?!剩余|到期|流量|官网|套餐|过期).)*$"
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
  - name: 🇭🇰 香港节点
    type: select
    include-all: true
    filter: "(?i)(香港|港|\\bHK\\b|Hong ?Kong)"
  - name: 🇺🇸 美国节点
    type: select
    include-all: true
    filter: "(?i)(美国|美|\\bUS\\b|\\bUSA\\b|United States|洛杉矶|圣何塞|西雅图|纽约|硅谷)"
  - name: 🇬🇧 英国节点
    type: select
    include-all: true
    filter: "(?i)(英国|英|\\bUK\\b|\\bGB\\b|United Kingdom|伦敦|London)"
  - name: 🇩🇪 德国节点
    type: select
    include-all: true
    filter: "(?i)(德国|德|\\bDE\\b|Germany|法兰克福|Frankfurt)"
  - name: 🇲🇽 墨西哥节点
    type: select
    include-all: true
    filter: "(?i)(墨西哥|\\bMX\\b|Mexico)"
  - name: 🏠 家宽节点
    type: select
    include-all: true
    filter: "(?i)(家宽|住宅|家庭|原生|\\bHome\\b|\\bISP\\b|Residential)"
  - name: 🤖 ChatGPT
    type: select
    proxies: [🇺🇸 美国节点, 🚀 节点选择, 🏠 家宽节点, 🇬🇧 英国节点, 🇩🇪 德国节点]
  - name: 💳 PayPal
    type: select
    proxies: [🏠 家宽节点, 🇺🇸 美国节点, 🚀 节点选择, 🇬🇧 英国节点, 🇩🇪 德国节点]
  - name: 🛒 国外电商
    type: select
    proxies: [🇺🇸 美国节点, 🏠 家宽节点, 🚀 节点选择, 🇭🇰 香港节点, 🇬🇧 英国节点, 🇩🇪 德国节点]
  - name: 🎶 TikTok
    type: select
    proxies: [🇲🇽 墨西哥节点, 🇺🇸 美国节点, 🏠 家宽节点, 🚀 节点选择, 🇬🇧 英国节点, 🇩🇪 德国节点]
  - name: 🐟 漏网之鱼
    type: select
    proxies: [🚀 节点选择, DIRECT]

